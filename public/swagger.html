<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cut 90 Planner – API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .swagger-ui .topbar { display: none; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 16px 24px 0;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #2563eb;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    /* Brand colors for HTTP method badges */
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #2563eb !important; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #059669 !important; }
    .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #d97706 !important; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #dc2626 !important; }
    .swagger-ui .btn.execute { background: #2563eb !important; border-color: #2563eb !important; }
  </style>
</head>
<body>
  <a class="back-link" href="/">← กลับหน้าหลัก</a>
  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout',
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
        docExpansion: 'list',
        filter: true,
        tryItOutEnabled: true,
      });
    };
  </script>
</body>
</html>
